<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo slide puzzle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1d1d">
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1d;--box:#e4dfd3;--btn:#1d1d1d;--btnfg:#fff;--dash:#8a8473;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f2f2f2;--box:#26262b;--btn:#f2f2f2;--btnfg:#17171a;--dash:#6f6f78}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#f2f2f2;--box:#26262b;--btn:#f2f2f2;--btnfg:#17171a;--dash:#6f6f78}
html{height:100vh;height:100dvh;overflow:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;box-sizing:border-box;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;text-align:center}
#controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
button,select,label.btn{font-size:18px;padding:12px 10px;border:0;border-radius:12px;background:var(--btn);color:var(--btnfg);font-family:inherit;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
select{background:var(--box);color:var(--fg)}
#note{height:40px;line-height:20px;font-size:15px;opacity:.8;overflow:hidden;margin-bottom:4px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#hint{width:100%;height:100%;box-sizing:border-box;border:3px dashed var(--dash);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:pointer;background:var(--box)}
#hint b{font-size:32px;line-height:1.2}
#hint span{font-size:20px;opacity:.75;line-height:1.35}
#game{display:none;align-items:center;justify-content:center;gap:10px}
#ref{position:relative;line-height:0}
#ref img{border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.4);object-fit:contain;display:block}
#ref em{position:absolute;left:6px;top:6px;font-style:normal;font-size:14px;line-height:1;background:rgba(0,0,0,.65);color:#fff;padding:4px 8px;border-radius:6px}
#box{position:relative;background:var(--box);border-radius:6px;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tile{position:absolute;transition:left .15s,top .15s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
#stats{height:26px;line-height:26px;font-size:18px;margin-top:6px;white-space:nowrap;overflow:hidden}
#status{height:36px;line-height:36px;font-size:20px;white-space:nowrap;overflow:hidden}
#status.win{font-size:26px;font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style></head><body>
<div id="controls">
  <label class="btn">📷 Use my own photo<input id="file" type="file" accept="image/*" hidden></label>
  <select id="size"><option value="3">Easy (3 wide)</option><option value="4">Medium (4 wide)</option><option value="5">Hard (5 wide)</option></select>
  <button id="start">Start</button>
  <button id="mute">Sound: on</button>
  <button id="nums" style="display:none">Numbers picture</button>
</div>
<div id="note"></div>
<div id="stage">
  <label id="hint" for="file"><b>📷 Tap here to choose a photo</b><span>It turns into a sliding puzzle.<br>Tap a piece next to the gap to slide it.</span></label>
  <div id="game"><div id="ref"><img id="refimg" alt="Goal photo"><em>Goal</em></div><div id="box"></div></div>
</div>
<div id="stats"></div>
<div id="status"></div>
<canvas id="fx"></canvas>
<script>
const $=id=>document.getElementById(id), box=$('box');
let img=null, url='', cols=3, rows=3, W=0, H=0, pw=0, ph=0, total=0;
let tiles=[], els=[], started=false, moves=0, t0=0, timer=null, sound=true, ac=null, lastCorrect=0;

let userPhoto='', showNumbers=true, numUrl='';

// the ready-made "easy" picture: 3x3 numbered, colour-coded squares
function makeNumbers(){
  const S=1200, t=S/3, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  x.font='bold 340px system-ui,sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.lineJoin='round'; x.lineWidth=30; x.strokeStyle='#000'; x.fillStyle='#fff';
  for(let k=1;k<=9;k++){
    const r=Math.floor((k-1)/3), q=(k-1)%3, h=(k-1)/9*0.85*360;
    x.fillStyle='hsl('+h+',88%,59%)'; x.fillRect(q*t,r*t,t,t);
    x.fillStyle='#fff';
    x.strokeText(k,q*t+t/2,r*t+t/2+10); x.fillText(k,q*t+t/2,r*t+t/2+10);
  }
  numUrl=c.toDataURL('image/png');
}

function showHint(){
  clearInterval(timer); started=false; img=null;
  $('hint').style.display='flex'; $('game').style.display='none';
  $('status').className=''; setStatus(''); $('stats').textContent='';
}

// decide which picture to play with, then build the puzzle
function applySource(){
  const useNum = cols===3 && (showNumbers || !userPhoto);
  const src = useNum ? numUrl : userPhoto;
  $('nums').style.display = (cols===3 && userPhoto && !showNumbers) ? 'flex' : 'none';
  $('note').textContent = !src ? '' : useNum
    ? 'Playing with the numbers picture. Tap “📷 Use my own photo” to play with yours.'
    : 'Playing with your photo. Tap “📷 Use my own photo” any time to pick another.';
  if(!src){ showHint(); return; }
  const im=new Image();
  im.onload=()=>{ img=im; url=src; build(false); };
  im.src=src;
}

$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  userPhoto=URL.createObjectURL(f); showNumbers=false;
  e.target.value='';
  applySource();
};
$('size').onchange=e=>{cols=+e.target.value; applySource();};
$('nums').onclick=()=>{ showNumbers=true; applySource(); };
$('start').onclick=start;
$('mute').onclick=()=>{sound=!sound; $('mute').textContent='Sound: '+(sound?'on':'off');};

// ---- sound (made live in the browser, no files) ----
function tone(freq,when,dur,type,vol){
  if(!sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+when;
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const SCALE=[0,2,4,7,9];   // pentatonic: every note sounds nice together
function ding(n){ const semi=SCALE[n%5]+12*Math.floor(n/5); tone(392*Math.pow(2,semi/12),0,0.35,'triangle',0.2); }
function click(){ tone(180,0,0.06,'square',0.08); }
function fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*0.14,0.3,'triangle',0.22)); }

function fmt(sec){ return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function bestKey(){ return 'slide-best-'+cols+'x'+rows; }
function getBest(){ try{ return +localStorage.getItem(bestKey())||0; }catch(e){ return 0; } }
function setBest(v){ try{ localStorage.setItem(bestKey(),v); }catch(e){} }
function showStats(){
  const el=started?Math.floor((Date.now()-t0)/1000):0, b=getBest();
  $('stats').textContent='Time '+fmt(el)+'  ·  Moves '+moves+(b?'  ·  Best '+fmt(b):'');
}

// ---- confetti ----
function confetti(){
  const cv=$('fx'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const P=[...Array(140)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,c:'hsl('+Math.random()*360+',90%,60%)'}));
  const end=Date.now()+3500;
  (function f(){
    x.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6);});
    if(Date.now()<end) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height);
  })();
}

function build(keep){
  if(!img) return;
  $('hint').style.display='none';
  const game=$('game'); game.style.display='flex';
  box.innerHTML=''; els=[];
  const stage=$('stage'), sw=stage.clientWidth, sh=stage.clientHeight, gap=10;
  const land=sw>sh*1.25, ri=$('refimg');
  ri.src=url;
  let availW, availH;
  if(land){                                   // wide screen: goal photo on the left
    const rw=Math.round(sw*0.24);
    game.style.flexDirection='row';
    ri.style.width=rw+'px'; ri.style.height='auto'; ri.style.maxHeight=sh+'px'; ri.style.maxWidth='none';
    availW=sw-rw-gap; availH=sh;
  } else {                                    // tall screen: goal photo on top
    const rh=Math.round(Math.min(sh*0.24,240));
    game.style.flexDirection='column';
    ri.style.height=rh+'px'; ri.style.width='auto'; ri.style.maxWidth=sw+'px'; ri.style.maxHeight='none';
    availW=sw; availH=sh-rh-gap;
  }
  const sc=Math.min(availW/img.naturalWidth, availH/img.naturalHeight);
  const w=img.naturalWidth*sc, h=img.naturalHeight*sc;
  rows=Math.max(2,Math.round(cols*h/w));
  pw=Math.floor(w/cols); ph=Math.floor(h/rows); W=pw*cols; H=ph*rows;
  total=cols*rows;
  box.style.width=W+'px'; box.style.height=H+'px';
  if(!keep){ tiles=[...Array(total).keys()]; started=false; moves=0; lastCorrect=0; clearInterval(timer); $('status').className=''; }
  for(let id=0;id<total;id++){
    const el=document.createElement('div'); el.className='tile';
    el.style.width=pw+'px'; el.style.height=ph+'px';
    el.style.backgroundImage=`url(${url})`;
    el.style.backgroundSize=W+'px '+H+'px';
    el.style.backgroundPosition=`-${(id%cols)*pw}px -${Math.floor(id/cols)*ph}px`;
    els.push(el); box.appendChild(el);
  }
  if(keep && started) els[total-1].style.display='none';
  render();
  if(!keep){ $('start').textContent='Start'; setStatus('Tap Start to scramble it.'); showStats(); }
}
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(img) build(true); },200); });

function render(){
  tiles.forEach((id,cell)=>{
    els[id].style.left=(cell%cols)*pw+'px';
    els[id].style.top=Math.floor(cell/cols)*ph+'px';
  });
}

function setStatus(t){ $('status').textContent=t; }

function start(){
  if(!img) { setStatus('Choose a photo first.'); return; }
  tiles=[...Array(total).keys()];
  els[total-1].style.display='none';            // remove last piece = the gap
  let e=total-1, prev=-1;
  for(let n=0;n<total*30;n++){
    const opts=[];
    if(e%cols>0) opts.push(e-1);
    if(e%cols<cols-1) opts.push(e+1);
    if(e>=cols) opts.push(e-cols);
    if(e<total-cols) opts.push(e+cols);
    const choices=opts.filter(c=>c!==prev);
    const nx=choices[Math.floor(Math.random()*choices.length)];
    [tiles[e],tiles[nx]]=[tiles[nx],tiles[e]]; prev=e; e=nx;
  }
  started=true; moves=0; lastCorrect=0; t0=Date.now(); render();
  $('status').className=''; clearInterval(timer); timer=setInterval(showStats,500); showStats();
  $('start').textContent='Scramble again';
  setStatus('Tap a piece next to the gap.');
}

box.addEventListener('pointerdown',ev=>{
  if(!started) return;
  const r=box.getBoundingClientRect();
  const c=Math.floor((ev.clientX-r.left)/pw), rw=Math.floor((ev.clientY-r.top)/ph);
  if(c<0||c>=cols||rw<0||rw>=rows) return;
  const clicked=rw*cols+c;
  let e=tiles.indexOf(total-1);
  if(clicked===e) return;
  const ec=e%cols, er=Math.floor(e/cols);
  let step;
  if(rw===er) step=clicked>e?1:-1;            // same row: slide the whole line
  else if(c===ec) step=clicked>e?cols:-cols;  // same column
  else return;
  while(e!==clicked){
    const nx=e+step;
    [tiles[e],tiles[nx]]=[tiles[nx],tiles[e]]; e=nx;
  }
  moves++; render();
  const correct=tiles.filter((id,i)=>id===i&&id!==total-1).length;
  if(tiles.every((id,i)=>id===i)){
    started=false; clearInterval(timer);
    els[total-1].style.display='block';
    const secs=Math.floor((Date.now()-t0)/1000), b=getBest();
    if(!b||secs<b) setBest(secs);
    showStats(); fanfare(); confetti();
    $('status').className='win'; setStatus('Congratulations! 🎉');
  } else {
    if(correct>lastCorrect) ding(correct-1); else click();
    setStatus('Tap a piece next to the gap.'); showStats();
  }
  lastCorrect=correct;
});
makeNumbers(); applySource();
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script></body></html>
